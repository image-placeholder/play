name: Train Tiny LLM

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model size preset: nano | micro | mini"
        default: "micro"
        required: true
        type: choice
        options: [nano, micro, mini]
      dataset:
        description: "Dataset: tinystories | explain_code"
        default: "tinystories"
        required: true
        type: choice
        options: [tinystories, explain_code]
      iters:
        description: "Training iterations (0 = use preset default)"
        default: "0"
      resume:
        description: "Resume from checkpoint?"
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install "torch>=2.4.0" --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece tqdm requests "datasets>=2.19" "transformers>=4.40"

      - name: Clone karpathy/llama2.c
        run: |
          git clone --depth 1 https://github.com/karpathy/llama2.c.git
          echo "llama2.c @ $(git -C llama2.c rev-parse --short HEAD)"

      - name: Cache explain_code dataset
        if: github.event.inputs.dataset == 'explain_code'
        uses: actions/cache@v4
        with:
          path: llama2.c/data/TinyStories_all_data
          key: explain-code-pretok-v4

      - name: Build + pretokenize explain_code dataset
        if: github.event.inputs.dataset == 'explain_code'
        run: |
          python scripts/build_explain_code_dataset.py \
            --source code_alpaca \
            --tokenizer llama2.c/tokenizer.model \
            --out_dir llama2.c/data/TinyStories_all_data \
            --max_examples 20000

      - name: Write train_config.py
        run: |
          python - << 'PYEOF'
          import os, pathlib, textwrap

          model = os.environ["MODEL"]
          iters_input = int(os.environ.get("ITERS", "0"))
          resume = os.environ.get("RESUME", "false").lower() == "true"

          # PRESETS optimized for Logic and Parameter Budget
          # micro is now ~15.2M Params: (32000*160) + 12*(12*160^2)
          PRESETS = {
              "nano":  dict(dim=96,  n_layers=8,  n_heads=6, n_kv_heads=2, hidden_dim=192, seq_len=256, bs=32, ga=1, lr=8e-4, iters=1000, eval=100, warm=100),
              "micro": dict(dim=160, n_layers=12, n_heads=8, n_kv_heads=4, hidden_dim=320, seq_len=384, bs=32, ga=2, lr=4e-4, iters=2000, eval=200, warm=200),
              "mini":  dict(dim=288, n_layers=12, n_heads=12, n_kv_heads=6, hidden_dim=768, seq_len=512, bs=16, ga=4, lr=3e-4, iters=3000, eval=250, warm=200),
          }
          
          p = PRESETS.get(model, PRESETS["micro"])
          max_iters = iters_input if iters_input > 0 else p["iters"]
          
          cfg = f"""\
          dim = {p["dim"]}
          n_layers = {p["n_layers"]}
          n_heads = {p["n_heads"]}
          n_kv_heads = {p["n_kv_heads"]}
          multiple_of = 32
          max_seq_len = {p["seq_len"]}
          max_iters = {max_iters}
          batch_size = {p["bs"]}
          gradient_accumulation_steps = {p["ga"]}
          learning_rate = {p["lr"]}
          warmup_iters = {min(p["warm"], max_iters // 2)}
          lr_decay_iters = {max_iters}
          min_lr = {p["lr"] * 0.1}
          weight_decay = 0.15
          grad_clip = 1.0
          eval_interval = {max(1, min(p["eval"], max_iters))}
          log_interval = 10
          init_from = "{'resume' if resume else 'scratch'}"
          dataset = "data"
          vocab_source = "llama2"
          vocab_size = 32000
          device = "cpu"
          dtype = "float32"
          compile = False
          """
          pathlib.Path("llama2.c/train_config.py").write_text(textwrap.dedent(cfg))
          PYEOF
        env:
          MODEL: ${{ github.event.inputs.model }}
          ITERS: ${{ github.event.inputs.iters }}
          RESUME: ${{ github.event.inputs.resume }}

      - name: Train with Loss Watchdog
        run: |
          cd llama2.c
          # Start training in background and redirect output to log file
          python train.py train_config.py > train.log 2>&1 &
          TRAIN_PID=$!
          
          echo "Training started (PID: $TRAIN_PID). Monitoring loss..."
          
          # Watchdog loop: Check every 60 seconds
          for i in {1..360}; do
            sleep 60
            if ! kill -0 $TRAIN_PID 2>/dev/null; then
              echo "Training finished naturally."
              wait $TRAIN_PID
              exit 0
            fi
            
            # Extract last reported loss from log
            CURRENT_LOSS=$(grep -oP 'loss \K[0-9.]+' train.log | tail -1)
            CURRENT_ITER=$(grep -oP 'step \K[0-9]+' train.log | tail -1)
            
            if [ ! -z "$CURRENT_LOSS" ]; then
              echo "Step $CURRENT_ITER: Current Loss $CURRENT_LOSS"
              
              # Watchdog Logic: If at step 200+ loss is still > 4.5, kill it
              if [ "$CURRENT_ITER" -gt 200 ] && [ $(echo "$CURRENT_LOSS > 4.5" | bc -l) -eq 1 ]; then
                echo "FAILSAFE: Loss is too high ($CURRENT_LOSS) at step $CURRENT_ITER. Architecture/LR mismatch. Terminating."
                kill $TRAIN_PID
                exit 1
              fi
            fi
          done

      - name: Export checkpoint
        if: success()
        run: |
          cd llama2.c
          MODEL="${{ github.event.inputs.model }}"
          DATASET="${{ github.event.inputs.dataset }}"
          OUT_NAME="model_${MODEL}_${DATASET}.bin"
          python export.py "out/${OUT_NAME}" --version 1 --checkpoint "out/ckpt.pt"

      - name: Commit model outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p model_out
          cp llama2.c/out/*.bin model_out/
          git add model_out/
          git commit -m "Add trained model - ${{ github.event.inputs.model }}" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
