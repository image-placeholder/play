name: Train Tiny LLM

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model size preset: nano | micro | mini"
        default: "micro"
        required: true
        type: choice
        options: [nano, micro, mini]
      dataset:
        description: "Dataset: tinystories | explain_code"
        default: "tinystories"
        required: true
        type: choice
        options: [tinystories, explain_code]
      iters:
        description: "Training iterations (0 = use preset default)"
        default: "0"
      resume:
        description: "Resume from checkpoint?"
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install "torch>=2.4.0" --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece tqdm requests "datasets>=2.19" "transformers>=4.40"

      - name: Clone karpathy/llama2.c
        run: |
          git clone --depth 1 https://github.com/karpathy/llama2.c.git
          echo "llama2.c @ $(git -C llama2.c rev-parse --short HEAD)"

      - name: Cache TinyStories dataset
        if: github.event.inputs.dataset == 'tinystories'
        uses: actions/cache@v4
        with:
          path: llama2.c/data
          key: tinystories-pretok-v1

      - name: Download + pretokenize TinyStories
        if: github.event.inputs.dataset == 'tinystories'
        run: |
          cd llama2.c
          if [ ! -d "data/TinyStories_all_data" ]; then
            python tinystories.py download
          fi
          if [ ! -f "data/TinyStories_all_data/data00.bin" ]; then
            python tinystories.py pretokenize
          fi

      - name: Cache explain_code dataset
        if: github.event.inputs.dataset == 'explain_code'
        uses: actions/cache@v4
        with:
          path: llama2.c/data/TinyStories_all_data
          key: explain-code-pretok-v3

      - name: Build + pretokenize explain_code dataset
        if: github.event.inputs.dataset == 'explain_code'
        run: |
          python - << 'PYEOF'
          import os, json, pathlib
          import numpy as np
          from datasets import load_dataset
          import sentencepiece as spm

          OUT_DIR = pathlib.Path("llama2.c/data/TinyStories_all_data")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          if list(OUT_DIR.glob("data*.bin")):
              print("Cache hit — skipping build.")
              exit(0)

          SHARD_SIZE, MAX_SEQ, BOS, EOS = 8_000_000, 480, 1, 2
          
          # Load Tokenizer
          tok_path = pathlib.Path("llama2.c/tokenizer.model")
          if not tok_path.exists():
              import urllib.request
              url = "https://huggingface.co/hf-internal-testing/llama-tokenizer/resolve/main/tokenizer.model"
              urllib.request.urlretrieve(url, tok_path)
          
          sp = spm.SentencePieceProcessor()
          sp.Load(str(tok_path))

          ds = load_dataset("code_search_net", "python", split="train", trust_remote_code=True)
          shard_idx, shard_toks, n_written, total_toks = 0, [], 0, 0

          for ex in ds:
              code = (ex.get("func_code_string") or "").strip()
              doc = (ex.get("func_documentation_string") or "").strip()
              if not code or not doc: continue
              text = f"Task: explain_code\nInput: {code[:600]}\nOutput: {doc.split('.')[0]}"
              ids = [BOS] + sp.encode(text, out_type=int)[:MAX_SEQ] + [EOS]
              shard_toks.extend(ids)
              total_toks += len(ids)
              n_written += 1
              if len(shard_toks) >= SHARD_SIZE:
                  np.array(shard_toks, dtype=np.uint16).tofile(OUT_DIR / f"data{shard_idx:02d}.bin")
                  shard_idx += 1
                  shard_toks = []

          if shard_toks:
              np.array(shard_toks, dtype=np.uint16).tofile(OUT_DIR / f"data{shard_idx:02d}.bin")
              shard_idx += 1

          meta = {"examples": n_written, "total_tokens": total_toks, "shards": shard_idx, "vocab_size": 32000}
          (OUT_DIR / "meta.json").write_text(json.dumps(meta, indent=2))
          PYEOF

      - name: Write train_config.py
        run: |
          python - << 'PYEOF'
          import os, pathlib, textwrap

          model = os.environ["MODEL"]
          iters_input = int(os.environ.get("ITERS", "0"))
          resume = os.environ.get("RESUME", "false").lower() == "true"

          PRESETS = {
              "nano":  dict(dim=64,  n_layers=4, n_heads=4, n_kv_heads=4, hidden_dim=128, seq_len=256, bs=32, ga=1, lr=8e-4, iters=300, eval=100, warm=50),
              "micro": dict(dim=128, n_layers=5, n_heads=4, n_kv_heads=4, hidden_dim=256, seq_len=256, bs=32, ga=2, lr=5e-4, iters=600, eval=200, warm=100),
              "mini":  dict(dim=288, n_layers=6, n_heads=6, n_kv_heads=6, hidden_dim=768, seq_len=256, bs=16, ga=4, lr=3e-4, iters=1000, eval=250, warm=100),
          }
          p = PRESETS.get(model, PRESETS["micro"])
          max_iters = iters_input if iters_input > 0 else p["iters"]
          
          # FIX: Prevent ZeroDivisionError by ensuring decay > warmup
          warmup_iters = min(p["warm"], max_iters // 2) if max_iters > 1 else 0
          lr_decay_iters = max_iters + 1 
          eval_interval = max(1, min(p["eval"], max_iters))

          cfg = f"""\
          dim = {p["dim"]}
          n_layers = {p["n_layers"]}
          n_heads = {p["n_heads"]}
          n_kv_heads = {p["n_kv_heads"]}
          multiple_of = 32
          max_seq_len = {p["seq_len"]}
          max_iters = {max_iters}
          batch_size = {p["bs"]}
          gradient_accumulation_steps = {p["ga"]}
          learning_rate = {p["lr"]}
          warmup_iters = {warmup_iters}
          lr_decay_iters = {lr_decay_iters}
          min_lr = {p["lr"] * 0.1}
          weight_decay = 0.1
          grad_clip = 1.0
          beta1 = 0.9
          beta2 = 0.95
          eval_interval = {eval_interval}
          log_interval = 10
          eval_iters = 20
          eval_only = False
          always_save_checkpoint = True
          out_dir = "out"
          init_from = "{'resume' if resume else 'scratch'}"
          dataset = "data"
          vocab_source = "llama2"
          vocab_size = 32000
          device = "cpu"
          dtype = "float32"
          compile = False
          """
          pathlib.Path("llama2.c/train_config.py").write_text(textwrap.dedent(cfg))
          PYEOF
        env:
          MODEL: ${{ github.event.inputs.model }}
          ITERS: ${{ github.event.inputs.iters }}
          RESUME: ${{ github.event.inputs.resume }}

      - name: Train model
        run: |
          cd llama2.c
          python train.py train_config.py

      - name: Export checkpoint to llama2.c v1 .bin
        run: |
          cd llama2.c
          MODEL="${{ github.event.inputs.model }}"
          DATASET="${{ github.event.inputs.dataset }}"
          OUT_NAME="model_${MODEL}_${DATASET}.bin"
          CKPT="out/ckpt.pt"
          
          if [ -f "$CKPT" ]; then
            python export.py "out/${OUT_NAME}" --version 1 --checkpoint "$CKPT"
            echo "Exported out/${OUT_NAME}"
          else
            echo "Training did not produce a checkpoint."
            exit 1
          fi

      - name: Commit model outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Files before add:"
          ls -lh llama2.c/out/
          # FORCE add actual outputs only
          git add -f llama2.c/out/model*.bin || true
          git add -f llama2.c/out/ckpt.pt || true
          echo "Git status after add:"
          git status
          if ! git diff --cached --quiet; then
            git commit -m "Add trained model"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes staged"
          fi
