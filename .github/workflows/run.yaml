name: Train Tiny LLM

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model size preset: nano | micro | mini"
        default: "micro"
        required: true
        type: choice
        options: [nano, micro, mini]

      dataset:
        description: "Dataset: tinystories | explain_code"
        default: "tinystories"
        required: true
        type: choice
        options: [tinystories, explain_code]

      iters:
        description: "Training iterations (0 = use preset default)"
        default: "0"

      resume:
        description: "Resume from checkpoint?"
        default: "false"
        type: choice
        options: ["false", "true"]

      early_stop:
        description: "Early stopping patience (0 = disabled)"
        default: "3"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install "torch>=2.4.0" --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece tqdm requests "datasets>=2.19" "transformers>=4.40"

      # ─────────────────────────────────────────────────────────────
      # DATA PREP (runs inside llama2.c as dependency only)
      # ─────────────────────────────────────────────────────────────

      - name: Clone llama2.c (for dataset tooling only)
        run: |
          git clone --depth 1 https://github.com/karpathy/llama2.c.git

      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: llama2.c/data
          key: llama2-data-cache-v1

      - name: Prepare TinyStories dataset
        if: github.event.inputs.dataset == 'tinystories'
        run: |
          cd llama2.c
          if [ ! -d "data/TinyStories_all_data" ]; then
            python tinystories.py download
            python tinystories.py pretokenize
          fi

      - name: Prepare explain_code dataset
        if: github.event.inputs.dataset == 'explain_code'
        run: |
          mkdir -p data/explain_code

          if [ ! -f "llama2.c/tokenizer.model" ]; then
            curl -sL \
              https://huggingface.co/hf-internal-testing/llama-tokenizer/resolve/main/tokenizer.model \
              -o llama2.c/tokenizer.model
          fi

          python scripts/build_explain_code_dataset.py \
            --source self_instruct \
            --out_dir llama2.c/data/explain_code \
            --tokenizer llama2.c/tokenizer.model \
            --max_seq_len 256

      # ─────────────────────────────────────────────────────────────
      # CONFIG GENERATION
      # ─────────────────────────────────────────────────────────────

      - name: Write train_config.py
        run: |
          python - << 'PYEOF'
          import os, pathlib, textwrap

          model = os.environ["MODEL"]
          iters = int(os.environ.get("ITERS", "0"))
          resume = os.environ.get("RESUME", "false") == "true"

          PRESETS = {
              "nano":  dict(dim=64,  layers=4, heads=4, kv=4, seq=256, bs=32, ga=1, lr=8e-4, iters=300),
              "micro": dict(dim=128, layers=5, heads=4, kv=4, seq=256, bs=32, ga=2, lr=5e-4, iters=600),
              "mini":  dict(dim=288, layers=6, heads=6, kv=6, seq=256, bs=16, ga=4, lr=3e-4, iters=1000),
          }

          p = PRESETS[model]
          max_iters = iters if iters > 0 else p["iters"]

          cfg = f"""
          dim = {p["dim"]}
          n_layers = {p["layers"]}
          n_heads = {p["heads"]}
          n_kv_heads = {p["kv"]}
          max_seq_len = {p["seq"]}
          batch_size = {p["bs"]}
          gradient_accumulation_steps = {p["ga"]}
          learning_rate = {p["lr"]}
          max_iters = {max_iters}
          warmup_iters = {max_iters // 20}
          lr_decay_iters = {max_iters}
          min_lr = {p["lr"] * 0.1}
          weight_decay = 0.1
          grad_clip = 1.0
          
          eval_interval = 200
          log_interval = 10
          eval_iters = 20
          
          out_dir = "out"
          dataset = "data/explain_code" if "{os.environ.get('DATASET','tinystories')}" == "explain_code" else "data"
          init_from = "{'resume' if resume else 'scratch'}"
          
          vocab_size = 32000
          vocab_source = "llama2"
          device = "cpu"
          dtype = "float32"
          compile = False
          """
          pathlib.Path("train_config.py").write_text(cfg)
          PYEOF
        env:
          MODEL: ${{ github.event.inputs.model }}
          ITERS: ${{ github.event.inputs.iters }}
          RESUME: ${{ github.event.inputs.resume }}
          DATASET: ${{ github.event.inputs.dataset }}

      # ─────────────────────────────────────────────────────────────
      # TRAINING (UPDATED: uses scripts/train.py)
      # ─────────────────────────────────────────────────────────────

      - name: Train model (scripts/train.py)
        id: train
        run: |
          mkdir -p out

          if [ "${{ github.event.inputs.early_stop }}" = "0" ]; then
            python scripts/train.py train_config.py
          else
            python scripts/train.py train_config.py 2>&1 | tee train_log.txt &
            TRAIN_PID=$!

            python llama2.c/early_stop_watcher.py \
              "${{ github.event.inputs.early_stop }}" $TRAIN_PID &

            WATCHER_PID=$!

            wait $TRAIN_PID
            TRAIN_EXIT=$?

            sleep 2
            kill $WATCHER_PID 2>/dev/null || true

            if [ $TRAIN_EXIT -ne 0 ]; then
              echo "::error::Training failed or was stopped."
              exit 1
            fi
          fi

      # ─────────────────────────────────────────────────────────────
      # EXPORT
      # ─────────────────────────────────────────────────────────────

      - name: Export model
        run: |
          python scripts/export.py out/model.bin || true

      # ─────────────────────────────────────────────────────────────
      # COMMIT OUTPUTS
      # ─────────────────────────────────────────────────────────────

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p model_out
          cp -r out/* model_out/ || true

          git add model_out
          if ! git diff --cached --quiet; then
            git commit -m "trained model output"
            git push
          fi
