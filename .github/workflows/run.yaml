name: Train Tiny LLM

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model size preset: nano | micro | mini"
        default: "micro"
        required: true
        type: choice
        options: [nano, micro, mini]
      dataset:
        description: "Dataset: tinystories | explain_code"
        default: "tinystories"
        required: true
        type: choice
        options: [tinystories, explain_code]
      iters:
        description: "Training iterations (0 = use preset default)"
        default: "0"
      resume:
        description: "Resume from checkpoint?"
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" "torch>=2.4.0" sentencepiece tqdm requests "datasets>=2.19" "transformers>=4.40" --index-url https://download.pytorch.org/whl/cpu

      - name: Clone karpathy/llama2.c
        run: |
          git clone --depth 1 https://github.com/karpathy/llama2.c.git

      - name: Build + pretokenize explain_code dataset
        if: github.event.inputs.dataset == 'explain_code'
        run: |
          # Use your script to build data
          python scripts/build_explain_code_dataset.py \
            --source code_alpaca \
            --tokenizer llama2.c/tokenizer.model \
            --out_dir llama2.c/data/TinyStories_all_data \
            --max_examples 20000

      - name: Write train_config.py
        run: |
          python - << 'PYEOF'
          import os, pathlib, textwrap

          model = os.environ["MODEL"]
          iters_input = int(os.environ.get("ITERS", "0"))
          resume = os.environ.get("RESUME", "false").lower() == "true"

          # micro: (32000*128) + 12*(12*128^2) ≈ 15M Params
          PRESETS = {
              "nano":  dict(dim=96,  n_layers=6,  n_heads=6, n_kv_heads=2, hidden_dim=192, seq_len=256, bs=32, ga=1, lr=8e-4, iters=1000, eval=100, warm=100),
              "micro": dict(dim=128, n_layers=12, n_heads=8, n_kv_heads=4, hidden_dim=256, seq_len=256, bs=32, ga=2, lr=4e-4, iters=2000, eval=200, warm=200),
              "mini":  dict(dim=288, n_layers=12, n_heads=12, n_kv_heads=6, hidden_dim=768, seq_len=384, bs=16, ga=4, lr=3e-4, iters=3000, eval=250, warm=200),
          }
          
          p = PRESETS.get(model, PRESETS["micro"])
          max_iters = iters_input if iters_input > 0 else p["iters"]
          
          cfg = f"""\
          dim = {p["dim"]}
          n_layers = {p["n_layers"]}
          n_heads = {p["n_heads"]}
          n_kv_heads = {p["n_kv_heads"]}
          multiple_of = 32
          max_seq_len = {p["seq_len"]}
          max_iters = {max_iters}
          batch_size = {p["bs"]}
          gradient_accumulation_steps = {p["ga"]}
          learning_rate = {p["lr"]}
          warmup_iters = {min(p["warm"], max_iters // 2)}
          lr_decay_iters = {max_iters}
          min_lr = {p["lr"] * 0.1}
          weight_decay = 0.15
          grad_clip = 1.0
          eval_interval = {max(1, min(p["eval"], max_iters))}
          log_interval = 10
          eval_iters = 20
          eval_only = False
          always_save_checkpoint = True
          out_dir = "out"
          init_from = "{'resume' if resume else 'scratch'}"
          dataset = "data"
          vocab_source = "llama2"
          vocab_size = 32000
          device = "cpu"
          dtype = "float32"
          compile = False
          """
          pathlib.Path("llama2.c/train_config.py").write_text(textwrap.dedent(cfg))
          PYEOF
        env:
          MODEL: ${{ github.event.inputs.model }}
          ITERS: ${{ github.event.inputs.iters }}
          RESUME: ${{ github.event.inputs.resume }}

      - name: Train model
        run: |
          cd llama2.c
          # Running in foreground so we see the error if it crashes
          python train.py train_config.py

      - name: Export and Commit
        if: success()
        run: |
          cd llama2.c
          MODEL="${{ github.event.inputs.model }}"
          DATASET="${{ github.event.inputs.dataset }}"
          OUT_NAME="model_${MODEL}_${DATASET}.bin"
          python export.py "out/${OUT_NAME}" --version 1 --checkpoint "out/ckpt.pt"
          cd ..
          mkdir -p model_out
          cp llama2.c/out/*.bin model_out/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_out/
          git commit -m "Add trained model"
          git push origin HEAD:${{ github.ref_name }}
