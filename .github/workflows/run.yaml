name: Train Tiny LLM

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model size preset: nano | micro | mini"
        default: "micro"
        required: true
        type: choice
        options: [nano, micro, mini]
      dataset:
        description: "Dataset: tinystories | explain_code"
        default: "tinystories"
        required: true
        type: choice
        options: [tinystories, explain_code]
      iters:
        description: "Training iterations (0 = use preset default)"
        default: "0"
      resume:
        description: "Resume from checkpoint?"
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install "torch>=2.4.0" --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece tqdm requests "datasets>=2.19" "transformers>=4.40"

      - name: Clone karpathy/llama2.c
        run: |
          git clone --depth 1 https://github.com/karpathy/llama2.c.git
          echo "llama2.c @ $(git -C llama2.c rev-parse --short HEAD)"

      - name: Cache TinyStories dataset
        if: github.event.inputs.dataset == 'tinystories'
        uses: actions/cache@v4
        with:
          path: llama2.c/data
          key: tinystories-pretok-v1

      - name: Download + pretokenize TinyStories
        if: github.event.inputs.dataset == 'tinystories'
        run: |
          cd llama2.c
          if [ ! -d "data/TinyStories_all_data" ]; then
            python tinystories.py download
          else
            echo "TinyStories cached — skipping download."
          fi
          if [ ! -f "data/TinyStories_all_data/data00.bin" ]; then
            python tinystories.py pretokenize
          else
            echo "Pretokenization cached — skipping."
          fi

      - name: Cache explain_code dataset
        if: github.event.inputs.dataset == 'explain_code'
        uses: actions/cache@v4
        with:
          path: llama2.c/data/TinyStories_all_data
          key: explain-code-pretok-v3

      - name: Build + pretokenize explain_code dataset
        if: github.event.inputs.dataset == 'explain_code'
        run: |
          python - << 'PYEOF'
          import os, json, pathlib
          import numpy as np
          from datasets import load_dataset
          import sentencepiece as spm
          import urllib.request

          OUT_DIR = pathlib.Path("llama2.c/data/TinyStories_all_data")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          existing = sorted(OUT_DIR.glob("data*.bin"))
          if existing:
              print(f"Cache hit — {len(existing)} shard(s) present, skipping build.")
              raise SystemExit(0)

          SHARD_SIZE = 8_000_000
          MAX_SEQ    = 480
          BOS, EOS   = 1, 2

          sp = None
          for tc in ["llama2.c/tokenizer.model", "llama2.c/data/tok32000/tokenizer.model"]:
              if pathlib.Path(tc).exists():
                  sp = spm.SentencePieceProcessor()
                  sp.Load(tc)
                  print(f"Loaded tokenizer from {tc}")
                  break
          if sp is None:
              tok_path = pathlib.Path("llama2.c/tokenizer.model")
              urllib.request.urlretrieve(
                  "https://huggingface.co/hf-internal-testing/llama-tokenizer/resolve/main/tokenizer.model",
                  tok_path)
              sp = spm.SentencePieceProcessor()
              sp.Load(str(tok_path))

          ds = load_dataset("code_search_net", "python", split="train", trust_remote_code=True)
          print(f"Loaded {len(ds):,} examples")

          shard_idx, shard_toks, total_toks, n_written = 0, [], 0, 0

          def flush(toks, idx):
              arr = np.array(toks, dtype=np.uint16)
              arr.tofile(str(OUT_DIR / f"data{idx:02d}.bin"))
              print(f"  shard {idx:02d}: {len(arr):,} tokens")
              return idx + 1

          for ex in ds:
              code = (ex.get("func_code_string") or "").strip()
              doc  = (ex.get("func_documentation_string") or "").strip()
              if not code or not doc:
                  continue
              summary = doc.split("\n")[0].split(".")[0].strip()
              if len(summary) < 8:
                  summary = doc[:150].strip()
              text = f"Task: explain_code\nInput: {code[:600]}\nOutput: {summary}"
              ids = sp.encode(text, out_type=int)
              seq = [BOS] + list(ids[:MAX_SEQ]) + [EOS]
              shard_toks.extend(seq)
              total_toks += len(seq)
              n_written  += 1
              if len(shard_toks) >= SHARD_SIZE:
                  shard_idx  = flush(shard_toks, shard_idx)
                  shard_toks = []
          if shard_toks:
              shard_idx = flush(shard_toks, shard_idx)

          (OUT_DIR / "meta.json").write_text(json.dumps(
              {"examples": n_written, "total_tokens": total_toks, "shards": shard_idx}))
          print(f"Done: {n_written:,} examples, {total_toks:,} tokens, {shard_idx} shards")
          PYEOF

      - name: Write train_config.py
        env:
          MODEL:   ${{ github.event.inputs.model }}
          DATASET: ${{ github.event.inputs.dataset }}
          ITERS:   ${{ github.event.inputs.iters }}
          RESUME:  ${{ github.event.inputs.resume }}
        run: |
          python - << 'PYEOF'
          import os, pathlib, textwrap

          model  = os.environ["MODEL"]
          iters  = int(os.environ.get("ITERS", "0"))
          resume = os.environ.get("RESUME", "false").lower() == "true"

          PRESETS = {
              "nano":  dict(dim=64,  n_layers=4, n_heads=4, n_kv_heads=4, hidden_dim=128, seq_len=256, bs=32, ga=1, lr=8e-4, iters=300, eval=100, warm=50),
              "micro": dict(dim=128, n_layers=5, n_heads=4, n_kv_heads=4, hidden_dim=256, seq_len=256, bs=32, ga=2, lr=5e-4, iters=600, eval=200, warm=100),
              "mini":  dict(dim=288, n_layers=6, n_heads=6, n_kv_heads=6, hidden_dim=768, seq_len=256, bs=16, ga=4, lr=3e-4, iters=1000, eval=250, warm=100),
          }
          p = PRESETS.get(model, PRESETS["micro"])
          max_iters = iters if iters > 0 else p["iters"]

          cfg = textwrap.dedent(f"""
              dim            = {p["dim"]}
              n_layers       = {p["n_layers"]}
              n_heads        = {p["n_heads"]}
              n_kv_heads     = {p["n_kv_heads"]}
              multiple_of    = 32
              max_seq_len    = {p["seq_len"]}
              max_iters                   = {max_iters}
              batch_size                  = {p["bs"]}
              gradient_accumulation_steps = {p["ga"]}
              learning_rate               = {p["lr"]}
              warmup_iters                = {p["warm"]}
              lr_decay_iters              = {max_iters}
              min_lr                      = {p["lr"] * 0.1}
              weight_decay                = 0.1
              grad_clip                   = 1.0
              beta1                       = 0.9
              beta2                       = 0.95
              eval_interval           = {min(p["eval"], max_iters // 2)}
              log_interval            = 10
              eval_iters              = 20
              eval_only               = False
              always_save_checkpoint  = True
              out_dir    = "out"
              init_from  = "{'resume' if resume else 'scratch'}"
              dataset      = "data"
              vocab_source = "llama2"
              vocab_size   = 32000
              device  = "cpu"
              dtype   = "float32"
              compile = False
          """).strip()

          pathlib.Path("llama2.c/train_config.py").write_text(cfg)
          print(cfg)
          PYEOF

      - name: Train model
        run: |
          cd llama2.c
          python train.py train_config.py

      - name: Export checkpoint to .bin
        run: |
          cd llama2.c

          echo "=== Searching for checkpoints ==="
          find . -name "*.pt" -o -name "*.pth" 2>/dev/null | sort
          echo "=== Contents of out/ ==="
          ls -lh out/ 2>/dev/null || echo "out/ does not exist"

          # Find the checkpoint — train.py writes out/ckpt.pt but let's be safe
          CKPT=""
          for candidate in out/ckpt.pt out/model.pt ckpt.pt; do
            if [ -f "$candidate" ]; then
              CKPT="$candidate"
              echo "Found checkpoint: $CKPT"
              break
            fi
          done

          if [ -z "$CKPT" ]; then
            echo "ERROR: No checkpoint found. Training may have failed or not saved."
            exit 1
          fi

          python export.py out/model.bin --version 1 --checkpoint "$CKPT"

          MODEL="${{ github.event.inputs.model }}"
          DATASET="${{ github.event.inputs.dataset }}"
          mv out/model.bin "out/model_${MODEL}_${DATASET}.bin"
          ls -lh out/

          
      - name: Commit model outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          # Make sure we're on the correct branch
          git checkout ${{ github.ref_name }}
      
          # Add generated files
          git add llama2.c/out/*.bin llama2.c/out/*.txt || true
      
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Add model outputs for ${{ github.event.inputs.model }} / ${{ github.event.inputs.dataset }}"
            git push
          else
            echo "No changes to commit"
          fi
